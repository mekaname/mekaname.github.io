# Siteyi GitHub Pages'te yayınlar. Aşağıdaki dallara her gönderimde otomatik çalışır.
# İlk kez: depo Settings > Pages > Build and deployment > Source: "GitHub Actions" seçilmeli.
name: Siteyi yayınla

on:
  push:
    branches: [main, claude/site-yapimi-596xqf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Yayınlanacak dosyaları hazırla
        run: |
          mkdir -p _site
          cp -r index.html data assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dagit
        uses: actions/deploy-pages@v4
